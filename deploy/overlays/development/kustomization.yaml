apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-service-development
resources:
  - ../../base

images:
  - name: ghcr.io/stonetusker/tusker-demo-notification-service
    newName: ghcr.io/stonetusker/tusker-demo-notification-service
    newTag: b1072d232ef0621c38cfb2314914995bc8305160

replicas:
  - name: demo-service
    count: 2

configMapGenerator:
  - name: demo-service-config
    behavior: merge
    literals:
      - DEMO_FAILURE_MODE=none
      - FAILURE_DELAY_MS=2500

labels:
  - pairs:
      app.kubernetes.io/environment: development

commonAnnotations:
  tuskerblueprint.io/release-sha: b1072d232ef0621c38cfb2314914995bc8305160

patches:
  - path: deployment-selector-compatibility.yaml
