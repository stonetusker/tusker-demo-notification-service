apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-service-development
resources:
  - ../../base

images:
  - name: ghcr.io/stonetusker/tusker-demo-notification-service
    newName: ghcr.io/stonetusker/tusker-demo-notification-service
    newTag: c831a4954b73c6eade29f1fbd814af48aa4a10c4

replicas:
  - name: demo-service
    count: 1

configMapGenerator:
  - name: demo-service-config
    behavior: merge
    literals:
      - DEMO_FAILURE_MODE=none
      - FAILURE_DELAY_MS=2500

labels:
  - pairs:
      app.kubernetes.io/environment: development

commonAnnotations:
  tuskerblueprint.io/release-sha: c831a4954b73c6eade29f1fbd814af48aa4a10c4

patches:
  - path: deployment-selector-compatibility.yaml
